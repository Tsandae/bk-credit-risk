name: CI
# Every push and pull request: install, test (Modules 3-5 + Final), build every Docker image.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-pipeline.txt -r requirements-module4.txt -r requirements-final.txt -r dashboard/requirements.txt
      - name: Tests (the monitoring tests that need the private curated file skip themselves on CI)
        run: pytest -q --maxfail=5

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f docker/Dockerfile.api -t bk-credit-api .
      - name: Smoke-test the API container
        run: |
          docker run -d --name api -p 8000:8000 bk-credit-api
          for i in $(seq 1 20); do curl -fs http://localhost:8000/health && break || sleep 3; done
          curl -fs http://localhost:8000/health | grep '"ok"'
      - name: Build dashboard and monitoring images
        run: |
          docker build -f docker/Dockerfile.dashboard -t bk-credit-dashboard .
          docker build -f docker/Dockerfile.monitor -t bk-credit-monitor .
      - name: Validate docker-compose.yml
        run: ANON_SALT=ci docker compose config -q
